<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Diff</title>
	<script src="theme.js"></script>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="diff-dist/diff.css">
	<style>
		html, body { height: 100%; overflow: hidden; }
		body { display: flex; flex-direction: column; }
		#toolbar {
			display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex: none;
			border-bottom: 1px solid var(--vscode-panel-border); background: var(--vscode-editorWidget-background);
		}
		#title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
		#stats, #note { color: var(--vscode-descriptionForeground); white-space: nowrap; }
		#note { overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
		#toolbar button {
			font: inherit; padding: 2px 10px; border-radius: 5px; cursor: pointer;
			border: 1px solid var(--vscode-input-border); background: var(--vscode-input-background); color: var(--vscode-foreground);
		}
		#toolbar label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
		#diffControls { display: flex; align-items: center; gap: 6px; }
		#main { flex: 1; display: flex; min-height: 0; }
		#files {
			width: 280px; flex: none; overflow: auto; border-right: 1px solid var(--vscode-panel-border);
			display: flex; flex-direction: column; padding: 4px 0;
		}
		#files .file {
			display: flex; gap: 8px; align-items: center; text-align: left; font: inherit; color: var(--vscode-foreground);
			background: none; border: none; padding: 3px 10px; cursor: pointer; white-space: nowrap;
		}
		#files .file span:last-child { overflow: hidden; text-overflow: ellipsis; }
		#files .file:hover { background: var(--vscode-list-hoverBackground); }
		#files .file.selected { background: var(--vscode-menu-selectionBackground); color: var(--vscode-menu-selectionForeground); }
		#files .status { font-family: var(--vscode-editor-font-family); font-weight: 600; width: 1ch; }
		#files .sA, #files .sU { color: var(--vscode-gitDecoration-addedResourceForeground); }
		#files .sD { color: var(--vscode-gitDecoration-deletedResourceForeground); }
		#files .sM { color: var(--vscode-gitDecoration-modifiedResourceForeground); }
		#files .sR { color: var(--vscode-gitDecoration-renamedResourceForeground); }
		#editor { flex: 1; min-width: 0; }
		#binary { flex: 1; display: flex; gap: 16px; padding: 16px; overflow: auto; }
		#binary figure { flex: 1; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
		#binary figcaption { color: var(--vscode-descriptionForeground); }
		#binary img {
			max-width: 100%; object-fit: contain; align-self: flex-start;
			background: repeating-conic-gradient(#8884 0% 25%, transparent 0% 50%) 50% / 16px 16px;
		}
		#message { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--vscode-descriptionForeground); padding: 24px; text-align: center; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<div id="toolbar">
		<span id="title"></span>
		<span id="note"></span>
		<span id="stats"></span>
		<span id="diffControls">
			<button id="prev" title="Previous change">↑</button>
			<button id="next" title="Next change">↓</button>
			<button id="layout"></button>
			<label><input type="checkbox" id="whitespace"> Ignore whitespace</label>
		</span>
	</div>
	<div id="main">
		<aside id="files" hidden></aside>
		<div id="editor"></div>
		<div id="binary" hidden></div>
		<div id="message" hidden></div>
	</div>
	<script src="diff-dist/diff.js"></script>
</body>
</html>
