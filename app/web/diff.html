<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Diff</title>
	<script src="/theme.js"></script>
	<link rel="stylesheet" href="/theme.css">
	<link rel="stylesheet" href="/diff-dist/diff.css">
	<style>
		html, body { height: 100%; overflow: hidden; }
		body { display: flex; flex-direction: column; }
		#toolbar {
			display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex: none;
			border-bottom: 1px solid var(--gg-panel-border); background: var(--gg-editorWidget-background);
		}
		#title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
		#stats, #note { color: var(--gg-descriptionForeground); white-space: nowrap; }
		#note { overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
		#toolbar button {
			font: inherit; padding: 2px 10px; border-radius: 5px; cursor: pointer;
			border: 1px solid var(--gg-input-border); background: var(--gg-input-background); color: var(--gg-foreground);
		}
		#toolbar label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
		#diffControls { display: flex; align-items: center; gap: 6px; }
		#main { flex: 1; display: flex; min-height: 0; }
		#files {
			width: 280px; flex: none; overflow: auto; border-right: 1px solid var(--gg-panel-border);
			display: flex; flex-direction: column; padding: 4px 0;
		}
		#files .file {
			display: flex; gap: 8px; align-items: center; text-align: left; font: inherit; color: var(--gg-foreground);
			background: none; border: none; padding: 3px 10px; cursor: pointer; white-space: nowrap;
		}
		#files .file span:last-child { overflow: hidden; text-overflow: ellipsis; }
		#files .file:hover { background: var(--gg-list-hoverBackground); }
		#files .file.selected { background: var(--gg-menu-selectionBackground); color: var(--gg-menu-selectionForeground); }
		#files .status { font-family: var(--gg-editor-font-family); font-weight: 600; width: 1ch; }
		#files .sA, #files .sU { color: var(--gg-gitDecoration-addedResourceForeground); }
		#files .sD { color: var(--gg-gitDecoration-deletedResourceForeground); }
		#files .sM { color: var(--gg-gitDecoration-modifiedResourceForeground); }
		#files .sR { color: var(--gg-gitDecoration-renamedResourceForeground); }
		#editor { flex: 1; min-width: 0; }
		#binary { flex: 1; display: flex; gap: 16px; padding: 16px; overflow: auto; }
		#binary figure { flex: 1; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
		#binary figcaption { color: var(--gg-descriptionForeground); }
		#binary img {
			max-width: 100%; object-fit: contain; align-self: flex-start;
			background: repeating-conic-gradient(#8884 0% 25%, transparent 0% 50%) 50% / 16px 16px;
		}
		/* The rendered page beside a Markdown file (diff/main.js). */
		#preview { flex: 1; min-width: 0; overflow: auto; border-left: 1px solid var(--gg-panel-border); }
		#preview .md { padding: 12px 20px 40px; line-height: 1.55; overflow-wrap: break-word; user-select: text; -webkit-user-select: text; cursor: auto; }
		#preview .md > :first-child { margin-top: 0; }
		#preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 { margin: 1.4em 0 0.6em; line-height: 1.25; font-weight: 600; }
		#preview h1 { font-size: 1.8em; } #preview h2 { font-size: 1.45em; } #preview h3 { font-size: 1.2em; } #preview h4, #preview h5, #preview h6 { font-size: 1em; }
		#preview h1, #preview h2 { padding-bottom: 0.3em; border-bottom: 1px solid var(--gg-panel-border); }
		#preview p, #preview ul, #preview ol, #preview blockquote, #preview table, #preview pre { margin: 0 0 1em; }
		#preview ul, #preview ol { padding-left: 2em; }
		#preview li > ul, #preview li > ol { margin-bottom: 0; }
		#preview .contains-task-list { list-style: none; padding-left: 1.2em; }
		#preview .task-list-item-checkbox { margin: 0 0.4em 0 0; vertical-align: middle; }
		#preview a { color: var(--gg-textLink-foreground); cursor: pointer; }
		#preview blockquote { padding: 0 1em; color: var(--gg-descriptionForeground); border-left: 3px solid var(--gg-panel-border); }
		#preview hr { border: none; border-top: 1px solid var(--gg-panel-border); margin: 1.5em 0; }
		#preview code { font-family: var(--gg-editor-font-family); font-size: 0.92em; padding: 0.15em 0.35em; border-radius: 4px; background: var(--gg-textCodeBlock-background); }
		#preview pre { padding: 10px 12px; overflow: auto; border-radius: 6px; background: var(--gg-textCodeBlock-background); line-height: 1.45; }
		#preview pre code { padding: 0; background: none; font-size: 12px; }
		#preview table { border-collapse: collapse; display: block; overflow: auto; max-width: 100%; }
		#preview th, #preview td { padding: 5px 12px; border: 1px solid var(--gg-panel-border); }
		#preview th { font-weight: 600; background: var(--gg-textCodeBlock-background); }
		#preview img { max-width: 100%; }
		#preview .katex-display { overflow: auto hidden; }
		#preview pre.mermaid, #preview pre.plantuml.rendered { background: none; text-align: center; }
		#preview pre.mermaid:not([data-processed]) { text-align: left; background: var(--gg-textCodeBlock-background); }
		#preview pre.plantuml img { display: inline-block; }
		#preview .diagramNote { margin-top: 8px; font-family: var(--gg-font-family); white-space: normal; color: var(--gg-descriptionForeground); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
		#preview .diagramNote button {
			font: inherit; padding: 1px 10px; border-radius: 5px; cursor: pointer;
			border: 1px solid var(--gg-input-border); background: var(--gg-input-background); color: var(--gg-foreground);
		}
		#message { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--gg-descriptionForeground); padding: 24px; text-align: center; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<div id="toolbar">
		<span id="title"></span>
		<span id="note"></span>
		<span id="stats"></span>
		<label id="previewControl" hidden><input type="checkbox" id="previewToggle"> Preview</label>
		<span id="diffControls">
			<button id="prev" title="Previous change">↑</button>
			<button id="next" title="Next change">↓</button>
			<button id="layout"></button>
			<label><input type="checkbox" id="whitespace"> Ignore whitespace</label>
		</span>
	</div>
	<div id="main">
		<aside id="files" hidden></aside>
		<div id="editor"></div>
		<div id="preview" hidden></div>
		<div id="binary" hidden></div>
		<div id="message" hidden></div>
	</div>
	<script src="/diff-dist/diff.js"></script>
</body>
</html>
