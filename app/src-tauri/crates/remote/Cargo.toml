[package]
name = "gg-remote"
version = "0.8.1"
description = "Your Git Graph: the helper the app runs on a remote machine over ssh"
edition = "2021"
license = "MIT"
rust-version = "1.82"
publish = false

[dependencies]
gg-backend = { path = "../backend" }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "macros", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
tempfile = "3"
base64 = "0.22"
