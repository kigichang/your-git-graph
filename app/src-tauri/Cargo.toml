[package]
name = "git-graph-app"
version = "0.3.3"
description = "Your Git Graph: a standalone macOS app (Tauri 2 + git-graph-core)"
edition = "2021"
license = "MIT"
rust-version = "1.82"
publish = false

# Standalone: not part of the upstream workspace in vendor/.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The MIT-licensed engine, linked in-process (no Node-API layer).
git-graph-core = { path = "../../vendor/vscode-git-graph-rs/native/core" }
# git_exec: the same tokio tauri runs on, plus the process/timer features.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
# File watching (FSEvents); 8.2.1 was too recent when pinned.
notify = "=8.2.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
