[package]
name = "git-graph-app"
version = "0.8.2"
description = "Your Git Graph: a standalone macOS app (Tauri 2 + git-graph-core)"
edition = "2021"
license = "MIT"
rust-version = "1.82"
publish = false

# Standalone: not part of the upstream workspace in vendor/.
[workspace]
members = [".", "crates/backend", "crates/remote"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The engine, the git CLI, files and watching: shared with the remote helper.
gg-backend = { path = "crates/backend" }
# git_exec: the same tokio tauri runs on, plus the process/timer features.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
libc = "0.2"
notify = "=8.2.0"
# NSProcessInfo's activities: no App Nap while the self-test or a preview runs behind other windows.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
